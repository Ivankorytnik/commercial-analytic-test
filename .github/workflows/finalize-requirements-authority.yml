name: Finalize requirements authority architecture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch architecture and UI wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # index: load authority immediately after Logic Core, derived views last.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v1.11.2 EXPANDED GANTT FILTER FIX','v1.13.0 REQUIREMENTS MASTER',1)
          s=s.replace("'logic-core.js?v=1.2.0',", "'logic-core.js?v=1.2.0',\n          'requirements-authority.js?v=1.0.0',",1)
          s=s.replace("'final-consistency.js?v=1.0.0'", "'final-consistency.js?v=1.0.0',\n          'requirements-derived-views.js?v=1.0.0'",1)
          p.write_text(s,encoding='utf-8')

          # project-admin: remove text that says stages are an editable source of truth.
          p=Path('project-admin.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<b>Сроки меняются здесь или в обычном Ганте.</b> Это одни и те же даты. Все связанные требования команд автоматически получают новый период.','<b>Расчетный экран.</b> Сроки этапов формируются автоматически из периодов требований. Изменяйте сроки только на вкладке «Требования».',1)
          s=s.replace('<b>Этапы:</b> сроки.','<b>Этапы:</b> расчетное представление сроков из требований.',1)
          p.write_text(s,encoding='utf-8')

          # requirement editor wording: requirement owns the dates; Gantt is derived.
          p=Path('requirements-time.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='1.2.1';","const VERSION='1.3.0';",1)
          s=s.replace("${exact?'индивидуальный срок':'период этапа Ганта'}","${exact?'срок требования':'срок требования'}")
          s=s.replace("${exact?` <button type=\"button\" class=\"btn req-period-reset\" data-id=\"${esc(req.id)}\" style=\"margin-top:5px;padding:4px 7px;font-size:9px\">По Ганту</button>`:''}","")
          p.write_text(s,encoding='utf-8')

          # modal editor: no reverse reset to Gantt.
          p=Path('requirements-period-direct-trigger.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='2.1.0';","const VERSION='2.2.0';",1)
          s=s.replace('<button type="button" class="btn" data-rpm-reset ${p.customTimes?\'\':\'disabled\'}>По Ганту</button>','<span></span>',1)
          p.write_text(s,encoding='utf-8')

          # expanded Gantt source-of-truth wording at native render level.
          p=Path('logic-core-ui-fast.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Каждый пункт «Что нужно» связан с этапом основного Ганта и автоматически следует за его сроком','Каждый пункт «Что нужно» отображается по собственному периоду из «Управление проектом → Требования»',1)
          p.write_text(s,encoding='utf-8')

          # cache-bust changed files.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'project-admin.js?v=1.3.1'","'project-admin.js?v=1.3.2'",1)
          s=s.replace("'requirements-time.js?v=1.2.1'","'requirements-time.js?v=1.3.0'",1)
          s=s.replace("'requirements-period-direct-trigger.js?v=2.1.0'","'requirements-period-direct-trigger.js?v=2.2.0'",1)
          s=s.replace("'logic-core-ui-fast.js?v=1.2.1'","'logic-core-ui-fast.js?v=1.2.2'",1)
          p.write_text(s,encoding='utf-8')

          Path('.github/workflows/finalize-requirements-authority.yml').unlink(missing_ok=True)
          PY

      - name: Syntax check changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check requirements-authority.js
          node --check requirements-derived-views.js
          node --check requirements-time.js
          node --check requirements-period-direct-trigger.js
          node --check project-admin.js
          node --check logic-core-ui-fast.js
          node --check expanded-gantt-team-filter.js
          node --check requirements-all-team-filter.js

      - name: Verify authority load order and no broken reverse labels
        shell: bash
        run: |
          set -euo pipefail
          grep -q "requirements-authority.js?v=1.0.0" index.html
          grep -q "requirements-derived-views.js?v=1.0.0" index.html
          grep -q "v1.13.0 REQUIREMENTS MASTER" index.html
          ! grep -q "Сроки меняются здесь или в обычном Ганте" project-admin.js
          ! grep -q ">По Ганту</button>" requirements-time.js

      - name: Commit architecture fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make requirements the primary project source'
          git push origin main
