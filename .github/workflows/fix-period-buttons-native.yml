name: Fix native requirement period buttons

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch native period controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1. Main requirements renderer: period edit control is part of the row itself.
          p = Path('project-admin.js')
          s = p.read_text(encoding='utf-8')
          old = '''<td><b>${fmt(p.startDate)} - ${fmt(p.endDate)}</b>${p.changed?'<br><span class="pa-note">срок этапа перенесен</span>':''}</td>'''
          new = '''<td class="pa-req-period"><b>${fmt(p.startDate)} - ${fmt(p.endDate)}</b>${p.customTimes?'<br><span class="pa-note">индивидуальный срок</span>':p.changed?'<br><span class="pa-note">срок этапа перенесен</span>':''}<br><button type="button" class="btn req-period-edit" data-id="${esc(r.id)}" style="margin-top:5px;padding:4px 7px;font-size:9px">Изменить</button></td>'''
          if old not in s:
              raise SystemExit('project-admin.js target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2. "All teams" renderer: it used to recreate tbody without the edit button.
          p = Path('requirements-all-team-filter.js')
          s = p.read_text(encoding='utf-8')
          old = '''<td><b>${fmt(p?.startDate)} - ${fmt(p?.endDate)}</b>${p?.changed?'<br><span class="pa-note">срок этапа перенесен</span>':''}</td>'''
          new = '''<td class="pa-req-period"><b>${fmt(p?.startDate)} - ${fmt(p?.endDate)}</b>${p?.customTimes?'<br><span class="pa-note">индивидуальный срок</span>':p?.changed?'<br><span class="pa-note">срок этапа перенесен</span>':''}<br><button type="button" class="btn req-period-edit" data-id="${esc(r.id)}" style="margin-top:5px;padding:4px 7px;font-size:9px">Изменить</button></td>'''
          if old not in s:
              raise SystemExit('requirements-all-team-filter.js target not found')
          s = s.replace(old, new, 1)
          s = s.replace("const VERSION='1.1.0';", "const VERSION='1.2.0';", 1)
          p.write_text(s, encoding='utf-8')

          # 3. Cache-bust only the changed modules and expose a new TEST build version.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v1.11.0 LOGIC CONSOLIDATION', 'v1.11.1 PERIOD BUTTON STABLE', 1)
          s = s.replace("'project-admin.js?v=1.3.0'", "'project-admin.js?v=1.3.1'", 1)
          s = s.replace("'requirements-all-team-filter.js?v=1.1.0'", "'requirements-all-team-filter.js?v=1.2.0'", 1)
          p.write_text(s, encoding='utf-8')

          # Remove this one-time workflow from the final application snapshot.
          Path('.github/workflows/fix-period-buttons-native.yml').unlink(missing_ok=True)
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix requirement period buttons across rerenders'
          git push origin main
