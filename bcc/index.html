<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1215" />
  <title>ATOM Business Control Center</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <div class="brand-name">ATOM BCC</div>
          <div class="brand-sub">Business Control Center</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span>Главная</button>
        <button class="nav-item" data-view="tasks"><span>✓</span>Мои задачи</button>
        <button class="nav-item" data-view="projects"><span>▦</span>Проекты</button>
        <button class="nav-item" data-view="meetings"><span>◷</span>Встречи</button>
        <button class="nav-item" data-view="kpi"><span>◉</span>KPI</button>
        <button class="nav-item" data-view="blockers"><span>!</span>Блокеры</button>
        <button class="nav-item" data-view="decisions"><span>?</span>Решения</button>
        <button class="nav-item" data-view="teams"><span>◎</span>Команды</button>
        <button class="nav-item" data-view="reports"><span>≡</span>Отчеты</button>
        <button class="nav-item" data-view="directories"><span>⚙</span>Справочники</button>
      </nav>

      <div class="sidebar-footer">
        <div class="env-pill">TEST</div>
        <div class="version">MVP 0.1.0</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="menuBtn" aria-label="Меню">☰</button>
          <div>
            <h1 id="pageTitle">Главная</h1>
            <p id="pageSubtitle">Что требует внимания сегодня</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn secondary" id="exportBtn">Экспорт</button>
          <label class="btn secondary file-label">Импорт<input type="file" id="importInput" accept="application/json" hidden></label>
          <button class="btn primary" id="quickAddBtn">+ Добавить</button>
        </div>
      </header>

      <div class="public-warning">
        <strong>Тестовый публичный контур.</strong> Не вводите конфиденциальные данные АО «КАМА» и персональные данные сотрудников.
      </div>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <div class="eyebrow">ATOM BCC</div>
          <h2 id="modalTitle">Добавить</h2>
        </div>
        <button class="icon-btn" id="closeModalBtn" aria-label="Закрыть">×</button>
      </div>
      <form id="entityForm" class="form-grid"></form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="./app.js"></script>
</body>
</html>
